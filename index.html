<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>HackPass Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  :root{--bg:#f6f8fc;--surf:#fff;--surf2:#eef2f8;--txt:#0f172a;--txt2:#475569;--brd:#dbe4ef;--pri:#3b82f6;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--r:14px;--rs:10px}
  body.dark{--bg:#0a0e16;--surf:#131b27;--surf2:#1c2737;--txt:#eef4fb;--txt2:#94a3b8;--brd:#26344a;--pri:#60a5fa;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
  body{background:var(--bg);color:var(--txt);min-height:100vh;padding:16px;line-height:1.5;transition:background .25s,color .25s}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:22px;box-shadow:0 4px 14px -4px rgba(15,23,42,.12)}
  h1{font-size:1.4rem;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .sub{font-size:.85rem;color:var(--txt2);margin-bottom:16px}
  .vid{width:100%;aspect-ratio:4/3;background:#000;border-radius:var(--r);overflow:hidden;position:relative;border:2px solid var(--brd)}
  .vid.scan{border-color:var(--pri)}
  #cam{width:100%;height:100%;object-fit:contain;display:block}
  .ov{position:absolute;inset:0;pointer-events:none;display:none}
  .vid.scan .ov{display:block}
  .ov::before{content:'';position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--pri),transparent);box-shadow:0 0 8px var(--pri);animation:scanln 2s ease-in-out infinite;top:0}
  @keyframes scanln{0%{top:0}50%{top:100%}100%{top:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{padding:13px 20px;border-radius:var(--rs);border:none;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surf2);color:var(--txt);border:1px solid var(--brd);flex:1}
  .btn-pri{background:var(--pri);color:#fff;border:none}
  .btn-pri:hover:not(:disabled){filter:brightness(1.1)}
  .btn-ok{background:var(--ok);color:#fff;border:none}
  .btn-ok:hover:not(:disabled){filter:brightness(1.1)}
  .btn-bad{background:var(--bad);color:#fff;border:none}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{padding:12px 16px;border-radius:var(--rs);font-weight:600;margin-top:14px;display:flex;align-items:center;gap:10px;font-size:.9rem;word-break:break-word;animation:pop .25s ease}
  .msg-info{background:rgba(59,130,246,.12);color:var(--pri);border:1px solid var(--pri)}
  .msg-ok{background:rgba(16,185,129,.12);color:var(--ok);border:1px solid var(--ok)}
  .msg-bad{background:rgba(239,68,68,.12);color:var(--bad);border:1px solid var(--bad)}
  .msg-warn{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid var(--warn)}
  .result{background:var(--surf2);border:1px solid var(--brd);border-radius:var(--rs);padding:16px;margin-top:14px;display:none;animation:pop .3s ease}
  .result.show{display:block}
  .result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--brd);font-size:.9rem}
  .result-row:last-of-type{border-bottom:none}
  .result-row .lbl{color:var(--txt2);font-weight:600}
  .result-row .val{font-weight:700;text-align:right;word-break:break-all;max-width:65%}
  .sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  .theme-btn{position:absolute;top:16px;right:16px;background:var(--surf2);border:1px solid var(--brd);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
  .diag{font-family:'Courier New',monospace;font-size:.72rem;color:var(--txt2);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
  .diag strong{color:var(--txt)}
  .hdr{position:relative}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="hdr">
      <button class="theme-btn" id="themeBtn">🌙</button>
      <h1>🎟️ HackPass Scanner</h1>
      <div class="sub">Scan a QR → decrypt → mark present</div>
    </div>

    <div class="vid" id="vidC">
      <video id="cam" autoplay playsinline webkit-playsinline muted></video>
      <div class="ov"></div>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="btn btn-pri" id="startBtn">▶ Start Camera</button>
      <button class="btn btn-bad" id="stopBtn" disabled>⏹ Stop</button>
    </div>

    <div class="diag">
      <span>video: <strong id="dRes">—</strong></span>
      <span>fps: <strong id="dFps">0</strong></span>
      <span>decodes: <strong id="dDec">0</strong></span>
      <span>misses: <strong id="dMiss">0</strong></span>
    </div>

    <div id="status" class="msg msg-info">
      <span>📷</span> Press Start Camera to begin.
    </div>

    <div id="resultBox" class="result">
      <div class="result-row"><span class="lbl">Name</span><span class="val" id="rName">—</span></div>
      <div class="result-row"><span class="lbl">Team</span><span class="val" id="rTeam">—</span></div>
      <div class="result-row"><span class="lbl">S.No</span><span class="val" id="rSno">—</span></div>
      <button class="btn btn-ok" id="markBtn" style="margin-top:14px;width:100%">✓ Mark Present</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   EMBEDDED CONFIG — do not share this file publicly
============================================================ */
const CFG = {
  gsUrl: 'https://script.google.com/macros/s/AKfycbwB57nZDBGkhYMvWNaZBqpmxUaWHtHlcR9EeCYJQVdG7K5huWOpc0ivBGTKp9B8MiA/exec',
  gsToken: 'hacksprint2',
  gsSheet: 'Participants',
  secretKey: 'HACK2024_GATEPASS_SECRET_KEY_9x7f'
};

/* ============================================================
   STATE
============================================================ */
let isCamOn = false, stream = null;
let rafId = null, lastScanTs = 0;
const SCAN_INTERVAL_MS = 100;
const MAX_SCAN_DIM = 800;

let scanCanvas = null, scanCtx = null;
let cropCanvas = null, cropCtx = null;

let lastText = null, lastTime = 0;
let currentPayload = null;
let diag = { frames: 0, decodes: 0, fpsStart: Date.now(), fps: 0, misses: 0 };

/* ============================================================
   DOM
============================================================ */
const $ = id => document.getElementById(id);
const cam = $('cam'), vidC = $('vidC'), startBtn = $('startBtn'), stopBtn = $('stopBtn');
const statusEl = $('status'), resultBox = $('resultBox');
const rName = $('rName'), rTeam = $('rTeam'), rSno = $('rSno'), markBtn = $('markBtn');
const dRes = $('dRes'), dFps = $('dFps'), dDec = $('dDec'), dMiss = $('dMiss');
const themeBtn = $('themeBtn');

/* ============================================================
   THEME
============================================================ */
if (localStorage.getItem('hp_theme') === 'dark') {
  document.body.classList.add('dark');
  themeBtn.textContent = '☀️';
}
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const d = document.body.classList.contains('dark');
  themeBtn.textContent = d ? '☀️' : '🌙';
  localStorage.setItem('hp_theme', d ? 'dark' : 'light');
});

/* ============================================================
   DECRYPT
============================================================ */
function xor(text, key) {
  let r = '';
  for (let i = 0; i < text.length; i++)
    r += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return r;
}
function decrypt(b64, key) {
  try { return xor(decodeURIComponent(escape(atob(b64))), key); }
  catch (e) { return null; }
}
function pickField(obj, candidates) {
  const keys = Object.keys(obj);
  for (const cand of candidates) {
    const c = cand.replace(/[\s._-]/g, '').toLowerCase();
    const found = keys.find(k => k.toLowerCase().replace(/[\s._-]/g, '') === c);
    if (found && obj[found] !== '' && obj[found] != null) return String(obj[found]).trim();
  }
  for (const cand of candidates) {
    const c = cand.replace(/[\s._-]/g, '').toLowerCase();
    const found = keys.find(k => k.toLowerCase().replace(/[\s._-]/g, '').includes(c));
    if (found && obj[found] !== '' && obj[found] != null) return String(obj[found]).trim();
  }
  return '';
}

/* ============================================================
   CAMERA
============================================================ */
async function startCamera() {
  if (isCamOn) return;
  try {
    setStatus('info', 'Requesting camera...');

    scanCanvas = document.createElement('canvas');
    scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
    cropCanvas = document.createElement('canvas');
    cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    cam.srcObject = stream;

    await new Promise(res => {
      if (cam.readyState >= 1) return res();
      cam.onloadedmetadata = () => res();
      setTimeout(res, 3000);
    });
    try { await cam.play(); } catch (e) {}

    let waited = 0;
    while ((!cam.videoWidth || !cam.videoHeight) && waited < 3000) {
      await new Promise(r => setTimeout(r, 100));
      waited += 100;
    }
    if (!cam.videoWidth) throw new Error('Camera stream has no dimensions');

    try {
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
    } catch (e) { /* ignore */ }

    isCamOn = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    vidC.classList.add('scan');
    setStatus('info', '📷 Camera active — point at a QR code');

    diag = { frames: 0, decodes: 0, fpsStart: Date.now(), fps: 0, misses: 0 };
    updateDiag();

    lastScanTs = 0;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(scanLoop);

  } catch (err) {
    console.error(err);
    setStatus('bad', '❌ ' + (err.message || 'Camera error'));
    startBtn.disabled = false;
    stopBtn.disabled = true;
    vidC.classList.remove('scan');
  }
}

function stopCamera() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  cam.srcObject = null;
  isCamOn = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  vidC.classList.remove('scan');
  setStatus('info', '⏹ Camera stopped.');
}
startBtn.addEventListener('click', startCamera);
stopBtn.addEventListener('click', stopCamera);

function scanLoop(ts) {
  if (!isCamOn) return;
  rafId = requestAnimationFrame(scanLoop);

  if (ts - lastScanTs < SCAN_INTERVAL_MS) return;
  lastScanTs = ts;

  if (!cam.videoWidth || cam.readyState < 2) return;

  const vw = cam.videoWidth, vh = cam.videoHeight;

  const scale = Math.min(1, MAX_SCAN_DIM / Math.max(vw, vh));
  const w1 = Math.max(1, Math.floor(vw * scale));
  const h1 = Math.max(1, Math.floor(vh * scale));

  if (scanCanvas.width !== w1 || scanCanvas.height !== h1) {
    scanCanvas.width = w1;
    scanCanvas.height = h1;
  }

  scanCtx.imageSmoothingEnabled = true;
  scanCtx.imageSmoothingQuality = 'high';
  scanCtx.drawImage(cam, 0, 0, vw, vh, 0, 0, w1, h1);

  let decoded = tryJsQR(scanCtx, w1, h1);
  diag.frames++;

  if (!decoded) {
    const cw = Math.floor(w1 * 0.6);
    const ch = Math.floor(h1 * 0.6);
    const cx = Math.floor((w1 - cw) / 2);
    const cy = Math.floor((h1 - ch) / 2);

    if (cropCanvas.width !== cw || cropCanvas.height !== ch) {
      cropCanvas.width = cw;
      cropCanvas.height = ch;
    }

    cropCtx.imageSmoothingEnabled = true;
    cropCtx.imageSmoothingQuality = 'high';
    cropCtx.drawImage(scanCanvas, cx, cy, cw, ch, 0, 0, cw, ch);

    decoded = tryJsQR(cropCtx, cw, ch);
    if (!decoded) diag.misses++;
  }

  if (diag.frames % 10 === 0) {
    diag.fps = Math.round(10000 / (Date.now() - diag.fpsStart));
    diag.fpsStart = Date.now();
    updateDiag();
  }

  if (decoded) {
    diag.decodes++;
    updateDiag();
    const now = Date.now(), txt = decoded.trim();
    if (lastText === txt && (now - lastTime) < 2000) return;
    lastText = txt; lastTime = now;
    handleQR(txt);
  }
}

function tryJsQR(ctx, w, h) {
  let img;
  try { img = ctx.getImageData(0, 0, w, h); }
  catch (e) { return null; }
  try {
    const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
    return code && code.data ? code.data.trim() : null;
  } catch (e) { return null; }
}

function updateDiag() {
  dRes.textContent = cam.videoWidth ? cam.videoWidth + '×' + cam.videoHeight : '—';
  dFps.textContent = diag.fps;
  dDec.textContent = diag.decodes;
  dMiss.textContent = diag.misses;
}

/* ============================================================
   QR HANDLER
============================================================ */
function handleQR(text) {
  if (!text.startsWith('HACKPASS:')) {
    setStatus('bad', '❌ Not a HackPass QR: ' + escapeHtml(text.substring(0, 40)));
    return;
  }
  const b64 = text.substring('HACKPASS:'.length);
  const decrypted = decrypt(b64, CFG.secretKey);
  if (decrypted === null) {
    setStatus('bad', '❌ Decryption failed — wrong key or corrupted QR.');
    return;
  }
  let payload;
  try { payload = JSON.parse(decrypted); }
  catch (e) {
    setStatus('bad', '❌ Not valid JSON after decrypt: ' + escapeHtml(decrypted.substring(0, 60)));
    return;
  }

  const sNo  = pickField(payload, ['s.no','sno','s_no','serial','id','roll','rollno','roll_no']);
  const team = pickField(payload, ['teamname','team','team_name','group']);
  const name = pickField(payload, ['studentname','student','name','student_name','fullname','full_name']);

  currentPayload = { sNo, team, name, raw: payload };

  rName.textContent = name || '—';
  rTeam.textContent = team || '—';
  rSno.textContent = sNo || '—';
  resultBox.classList.add('show');
  markBtn.disabled = false;
  markBtn.textContent = '✓ Mark Present';
  markBtn.className = 'btn btn-ok';

  if (navigator.vibrate) navigator.vibrate(80);

  setStatus('ok', `✅ Detected: ${name || 'unknown'}${team ? ' · ' + team : ''}`);
}

/* ============================================================
   MARK PRESENT
============================================================ */
markBtn.addEventListener('click', async () => {
  if (!currentPayload) return;
  const { sNo, name } = currentPayload;
  if (!sNo) {
    setStatus('bad', '❌ No S.No in QR — cannot match to sheet.');
    return;
  }
  markBtn.disabled = true;
  markBtn.innerHTML = '<span class="sp"></span> Marking...';

  try {
    const body = { token: CFG.gsToken, sheetName: CFG.gsSheet, marks: [{ sNo, present: true }] };
    const res = await fetch(CFG.gsUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    const json = await res.json();

    if (!json.ok) {
      setStatus('bad', '❌ Sheets error: ' + escapeHtml(json.error || 'unknown'));
      markBtn.innerHTML = '↻ Retry'; markBtn.disabled = false;
      return;
    }
    if (json.notFound && json.notFound.length > 0) {
      setStatus('warn', `⚠️ S.No "${sNo}" not found in sheet.`);
      markBtn.innerHTML = '↻ Retry'; markBtn.disabled = false;
      return;
    }
    if (json.applied && json.applied.length > 0) {
      setStatus('ok', `✅ ${name || sNo} marked PRESENT.`);
    } else if (json.alreadyMarked && json.alreadyMarked.length > 0) {
      setStatus('ok', `ℹ️ ${name || sNo} was already present.`);
    } else {
      setStatus('warn', '⚠️ Server returned OK but no rows changed.');
    }
    markBtn.innerHTML = '✓ Marked';
    markBtn.className = 'btn btn-pri';
  } catch (err) {
    setStatus('bad', '❌ Network error: ' + escapeHtml(String(err)));
    markBtn.innerHTML = '↻ Retry'; markBtn.disabled = false;
  }
});

/* ============================================================
   UTILS
============================================================ */
function setStatus(type, html) {
  statusEl.className = 'msg msg-' + type;
  statusEl.innerHTML = `<span>${type === 'ok' ? '✅' : type === 'bad' ? '❌' : type === 'warn' ? '⚠️' : 'ℹ️'}</span> ${html}`;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}

/* ============================================================
   BOOT
============================================================ */
window.addEventListener('beforeunload', () => {
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
