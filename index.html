<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>HackPass Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0508;--bg2:#120810;--surf:rgba(24,12,20,.85);--surf2:rgba(32,16,26,.75);--surf3:rgba(44,22,36,.6);
    --txt:#f5e8d8;--txt2:#b89880;--txt3:#6b5044;
    --brd:rgba(255,140,60,.16);--brd2:rgba(255,140,60,.32);
    --pumpkin:#ff7a1a;--pumpkin2:#e85d04;--pumpkin-soft:rgba(255,122,26,.16);--pumpkin-glow:rgba(255,122,26,.55);
    --blood:#e63347;--blood2:#b91c2c;--blood-soft:rgba(230,51,71,.16);--blood-glow:rgba(230,51,71,.55);
    --toxic:#7bff3d;--toxic2:#4ade18;--toxic-soft:rgba(123,255,61,.14);--toxic-glow:rgba(123,255,61,.5);
    --ghost:#a78bfa;--ghost2:#7c3aed;--ghost-soft:rgba(167,139,250,.14);--ghost-glow:rgba(167,139,250,.5);
    --candy:#ffb340;--candy2:#f59e0b;--candy-soft:rgba(255,179,64,.14);
    --r:22px;--rs:14px;
    --sh:0 8px 32px -8px rgba(0,0,0,.8),0 2px 8px -2px rgba(0,0,0,.5);
    --sh-lg:0 32px 64px -16px rgba(0,0,0,.85),0 12px 24px -8px rgba(0,0,0,.6);
    --glass:blur(20px) saturate(140%);
  }
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--txt);min-height:100vh;padding:24px 18px 40px;
    line-height:1.5;overflow-x:hidden;position:relative;
    transition:background .6s ease,color .6s ease;
  }
  #three-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.85}
  .wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}

  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes scanLine{0%{top:8%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:92%;opacity:0}}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 var(--pumpkin-glow),inset 0 0 0 0 var(--pumpkin-glow)}70%{box-shadow:0 0 0 24px transparent,inset 0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent,inset 0 0 0 0 transparent}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
  @keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes cornerGlow{0%,100%{opacity:.6}50%{opacity:1}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  @keyframes fadeOut{to{opacity:0;transform:scale(.96);visibility:hidden}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  @keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.1)}}
  @keyframes glowPulse{0%,100%{box-shadow:0 0 20px var(--pumpkin-glow),0 0 40px rgba(255,122,26,.2)}50%{box-shadow:0 0 32px var(--pumpkin-glow),0 0 60px rgba(255,122,26,.3)}}

  /* POPUP ANIMATIONS */
  @keyframes popupIn{0%{transform:scale(.6) translateY(40px);opacity:0}60%{transform:scale(1.04) translateY(-4px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
  @keyframes popupOut{to{transform:scale(.9) translateY(20px);opacity:0;visibility:hidden}}
  @keyframes backdropIn{from{opacity:0;backdrop-filter:blur(0)}to{opacity:1;backdrop-filter:blur(8px)}}
  @keyframes backdropOut{to{opacity:0;visibility:hidden}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes confettiFly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
  @keyframes ringExpand{0%{transform:scale(0);opacity:1}100%{transform:scale(2.5);opacity:0}}
  @keyframes checkDraw{0%{stroke-dashoffset:40}100%{stroke-dashoffset:0}}
  @keyframes heartFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(1.4);opacity:0}}
  @keyframes sparkleSpin{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.2)}}

  .card{
    background:var(--surf);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--brd);border-radius:var(--r);padding:32px;box-shadow:var(--sh);
    position:relative;overflow:hidden;
    transition:box-shadow .3s,border-color .3s,transform .3s;
    animation:fadeUp .7s cubic-bezier(.16,1,.3,1) both;
  }
  .card::before{
    content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:conic-gradient(from 0deg,transparent 0%,var(--pumpkin) 20%,transparent 40%,transparent 60%,var(--toxic) 80%,transparent 100%);
    animation:spinSlow 14s linear infinite;opacity:.14;pointer-events:none;
    mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
  }
  .card::after{
    content:'';position:absolute;inset:1px;background:var(--surf);
    backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border-radius:calc(var(--r) - 1px);z-index:-1;
  }
  .card > *{position:relative;z-index:1}
  .card:hover{border-color:var(--brd2)}
  @media(max-width:600px){.card{padding:22px;border-radius:18px}}

  #loginScreen{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:22px;z-index:100;background:rgba(10,5,8,.5);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:opacity .4s,transform .4s;
  }
  #loginScreen.hidden{animation:fadeOut .5s cubic-bezier(.16,1,.3,1) forwards;pointer-events:none}
  .login-card{
    background:var(--surf);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--brd);border-radius:24px;padding:40px 34px 34px;
    width:100%;max-width:430px;box-shadow:var(--sh-lg);position:relative;overflow:hidden;
    animation:fadeUp .7s cubic-bezier(.16,1,.3,1) both;
  }
  .login-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--pumpkin),var(--toxic),transparent);
    background-size:200% 100%;animation:gradientShift 4s ease infinite;
  }
  .login-card::after{
    content:'';position:absolute;top:-100px;right:-100px;width:200px;height:200px;
    background:radial-gradient(circle,var(--pumpkin-glow) 0%,transparent 70%);
    border-radius:50%;opacity:.4;pointer-events:none;animation:orbFloat1 8s ease-in-out infinite;
  }
  .login-icon{
    width:84px;height:84px;margin:0 auto 22px;border-radius:26px;
    background:linear-gradient(135deg,var(--pumpkin),var(--blood));
    display:flex;align-items:center;justify-content:center;font-size:2.6rem;
    box-shadow:0 20px 48px -12px var(--pumpkin-glow),0 8px 20px -6px var(--blood-glow);
    animation:float 3.5s ease-in-out infinite,glowPulse 3s ease-in-out infinite;
    position:relative;z-index:1;filter:drop-shadow(0 0 20px var(--pumpkin-glow));
  }
  .login-title{
    text-align:center;font-size:1.6rem;font-weight:800;letter-spacing:-.035em;margin-bottom:6px;
    background:linear-gradient(120deg,var(--pumpkin) 0%,var(--blood) 50%,var(--ghost) 100%);
    background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;animation:gradientShift 5s ease infinite;position:relative;z-index:1;
    text-shadow:0 0 40px var(--pumpkin-glow);
  }
  .login-sub{text-align:center;font-size:.88rem;color:var(--txt2);margin-bottom:30px;font-weight:500;position:relative;z-index:1}
  .field{margin-bottom:18px;position:relative}
  .field label{display:block;font-size:.72rem;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
  .field input{
    width:100%;padding:15px 18px;background:var(--surf2);border:1.5px solid var(--brd);
    border-radius:14px;color:var(--txt);font-size:.95rem;font-family:inherit;outline:none;
    transition:all .3s cubic-bezier(.16,1,.3,1);
  }
  .field input:focus{border-color:var(--pumpkin);background:var(--surf3);box-shadow:0 0 0 4px var(--pumpkin-soft),0 4px 16px -4px var(--pumpkin-glow)}
  .field input::placeholder{color:var(--txt3)}
  .field .toggle-pass{
    position:absolute;right:10px;bottom:8px;background:transparent;border:none;
    color:var(--txt3);cursor:pointer;padding:8px;border-radius:10px;font-size:1rem;transition:all .2s;
  }
  .field .toggle-pass:hover{background:var(--surf3);color:var(--pumpkin)}

  .login-btn{
    width:100%;padding:16px 24px;border-radius:16px;border:none;font-weight:800;font-size:.98rem;
    letter-spacing:.02em;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1);
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(135deg,var(--pumpkin) 0%,var(--blood) 100%);color:#fff;
    box-shadow:0 8px 28px -8px var(--pumpkin-glow),0 4px 12px -4px var(--blood-glow),inset 0 1px 0 rgba(255,255,255,.2);
    margin-top:10px;min-height:54px;position:relative;overflow:hidden;
    text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .login-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 60%);opacity:0;transition:opacity .3s}
  .login-btn::after{
    content:'';position:absolute;top:50%;left:50%;width:0;height:0;
    background:rgba(255,255,255,.25);border-radius:50%;transform:translate(-50%,-50%);
    transition:width .5s,height .5s;
  }
  .login-btn:hover:not(:disabled)::before{opacity:1}
  .login-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 14px 36px -10px var(--pumpkin-glow),0 6px 16px -4px var(--blood-glow),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.1)}
  .login-btn:active:not(:disabled){transform:translateY(0) scale(.98)}
  .login-btn:active:not(:disabled)::after{width:400px;height:400px}
  .login-btn:disabled{opacity:.6;cursor:not-allowed}
  .login-error{
    margin-top:16px;padding:13px 17px;border-radius:14px;
    background:var(--blood-soft);border:1px solid rgba(230,51,71,.35);color:var(--blood);
    font-weight:600;font-size:.85rem;display:none;align-items:center;gap:10px;animation:shake .4s;
  }
  .login-error.show{display:flex}
  .login-error .ico{
    width:20px;height:20px;border-radius:50%;background:var(--blood);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;flex-shrink:0;
  }

  .hdr{position:relative;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--brd)}
  .hdr::after{
    content:'';position:absolute;left:0;bottom:-1px;height:2px;width:72px;
    background:linear-gradient(90deg,var(--pumpkin),var(--toxic));border-radius:2px;
    box-shadow:0 0 12px var(--pumpkin-glow);
  }
  h1{font-size:1.65rem;font-weight:800;letter-spacing:-.04em;display:flex;align-items:center;gap:12px;margin-bottom:8px}
  h1 .ico{font-size:2rem;display:inline-block;animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 6px 12px var(--pumpkin-glow))}
  h1 .txt{
    background:linear-gradient(120deg,var(--pumpkin) 0%,var(--blood) 50%,var(--toxic) 100%);
    background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;animation:gradientShift 5s ease infinite;
    filter:drop-shadow(0 0 24px var(--pumpkin-glow));
  }
  .sub{font-size:.875rem;color:var(--txt2);font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sub .dot{width:7px;height:7px;border-radius:50%;background:var(--toxic);box-shadow:0 0 0 3px var(--toxic-soft),0 0 12px var(--toxic-glow);animation:pulseRing 2s infinite;flex-shrink:0}
  .sub .user-chip{
    display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;
    background:var(--pumpkin-soft);color:var(--pumpkin);font-weight:700;font-size:.75rem;
    text-transform:capitalize;border:1px solid rgba(255,122,26,.25);
    box-shadow:0 2px 8px -2px var(--pumpkin-glow);
  }
  .sub .user-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--toxic);box-shadow:0 0 6px var(--toxic-glow)}

  .icon-btn{
    position:absolute;top:0;width:44px;height:44px;background:var(--surf2);
    backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--brd);border-radius:14px;cursor:pointer;font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s cubic-bezier(.16,1,.3,1);
    box-shadow:0 2px 8px -2px rgba(0,0,0,.4);color:var(--txt2);
  }
  .icon-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px -4px var(--pumpkin-glow);background:var(--surf3);color:var(--pumpkin);border-color:var(--pumpkin)}
  .icon-btn:active{transform:translateY(0) scale(.94)}
  .theme-btn{right:0}
  .logout-btn{right:56px;width:auto;padding:0 14px;font-size:.78rem;font-weight:700;gap:6px}
  .logout-btn:hover{background:var(--blood-soft)!important;color:var(--blood)!important;border-color:rgba(230,51,71,.35)!important;box-shadow:0 6px 20px -4px var(--blood-glow)!important}

  /* DEBUG BUTTON — fixed bottom-right corner */
  .debug-btn{
    position:fixed;bottom:16px;right:16px;z-index:50;
    width:42px;height:42px;border-radius:50%;
    background:var(--surf2);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--brd);color:var(--txt3);cursor:pointer;font-size:1rem;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s cubic-bezier(.16,1,.3,1);
    box-shadow:0 4px 16px -4px rgba(0,0,0,.6);opacity:.35;
  }
  .debug-btn:hover{opacity:1;transform:scale(1.08);color:var(--pumpkin);border-color:var(--pumpkin);box-shadow:0 6px 20px -4px var(--pumpkin-glow)}
  .debug-btn.active{opacity:1;color:var(--pumpkin);border-color:var(--pumpkin);box-shadow:0 0 20px var(--pumpkin-glow)}

  /* DEBUG PANEL — fixed bottom-right, hidden by default */
  .debug-panel{
    position:fixed;bottom:66px;right:16px;z-index:50;
    background:var(--surf);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    border:1px solid var(--brd);border-radius:16px;padding:14px 16px;
    display:none;min-width:240px;
    box-shadow:0 12px 32px -8px rgba(0,0,0,.7);
    animation:fadeUp .25s cubic-bezier(.16,1,.3,1);
  }
  .debug-panel.show{display:block}
  .debug-panel .dbg-hdr{
    font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;
    color:var(--txt3);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--brd);
    display:flex;align-items:center;justify-content:space-between;
  }
  .debug-panel .dbg-hdr span:last-child{color:var(--pumpkin)}
  .diag{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
    font-family:'SF Mono','Courier New',monospace;
  }
  .diag-item{display:flex;flex-direction:column;gap:2px}
  .diag-item .lbl{font-size:.58rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .diag-item .val{font-size:.85rem;color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums;transition:color .2s}
  .diag-item .val.active{color:var(--pumpkin);text-shadow:0 0 10px var(--pumpkin-glow)}
  .diag-item .val.hit{color:var(--toxic);text-shadow:0 0 10px var(--toxic-glow)}

  .vid{
    width:100%;aspect-ratio:4/3;background:linear-gradient(180deg,#0a0508 0%,#000 100%);
    border-radius:var(--r);overflow:hidden;position:relative;border:2px solid var(--brd);
    transition:border-color .4s,box-shadow .4s;box-shadow:inset 0 0 80px rgba(0,0,0,.8);
  }
  .vid.scan{
    border-color:var(--pumpkin);
    box-shadow:0 0 0 4px var(--pumpkin-soft),inset 0 0 80px rgba(0,0,0,.8),0 12px 40px -12px var(--pumpkin-glow);
    animation:pulseRing 2.4s ease-out infinite;
  }
  #cam{width:100%;height:100%;object-fit:contain;display:block}

  .ov{position:absolute;inset:0;pointer-events:none;display:none}
  .vid.scan .ov{display:block}
  .ov .corner{
    position:absolute;width:40px;height:40px;border:3px solid var(--pumpkin);
    opacity:0;transition:opacity .4s;animation:cornerGlow 2s ease-in-out infinite;
    filter:drop-shadow(0 0 10px var(--pumpkin-glow));
  }
  .vid.scan .ov .corner{opacity:1}
  .ov .corner.tl{top:16px;left:16px;border-right:none;border-bottom:none;border-top-left-radius:14px}
  .ov .corner.tr{top:16px;right:16px;border-left:none;border-bottom:none;border-top-right-radius:14px}
  .ov .corner.bl{bottom:16px;left:16px;border-right:none;border-top:none;border-bottom-left-radius:14px}
  .ov .corner.br{bottom:16px;right:16px;border-left:none;border-top:none;border-bottom-right-radius:14px}
  .ov .scan-line{
    position:absolute;left:12%;right:12%;height:2px;
    background:linear-gradient(90deg,transparent,var(--pumpkin) 30%,var(--pumpkin) 70%,transparent);
    box-shadow:0 0 16px var(--pumpkin),0 0 6px var(--pumpkin);
    animation:scanLine 2.6s cubic-bezier(.4,0,.6,1) infinite;border-radius:2px;
  }

  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
  .btn{
    padding:16px 26px;border-radius:16px;border:none;font-weight:800;font-size:.92rem;
    letter-spacing:.03em;text-transform:uppercase;cursor:pointer;
    transition:all .3s cubic-bezier(.16,1,.3,1);
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:var(--surf2);color:var(--txt);border:1px solid var(--brd);flex:1;
    position:relative;overflow:hidden;
    box-shadow:0 2px 8px -2px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);
    min-height:54px;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
    text-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .3s}
  .btn::after{
    content:'';position:absolute;top:50%;left:50%;width:0;height:0;
    background:rgba(255,255,255,.25);border-radius:50%;transform:translate(-50%,-50%);
    transition:width .6s,height .6s;
  }
  .btn:hover:not(:disabled)::before{opacity:1}
  .btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 24px -6px rgba(0,0,0,.5)}
  .btn:active:not(:disabled){transform:translateY(0) scale(.97)}
  .btn:active:not(:disabled)::after{width:400px;height:400px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

  .btn-pri{
    background:linear-gradient(135deg,var(--pumpkin) 0%,var(--pumpkin2) 100%);
    color:#fff;border:none;
    box-shadow:0 8px 28px -8px var(--pumpkin-glow),0 4px 12px -4px var(--pumpkin-glow),inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-pri:hover:not(:disabled){box-shadow:0 14px 36px -10px var(--pumpkin-glow),0 6px 16px -4px var(--pumpkin-glow),inset 0 1px 0 rgba(255,255,255,.35);filter:brightness(1.1)}

  .btn-ok{
    background:linear-gradient(135deg,var(--toxic) 0%,var(--toxic2) 100%);
    color:#0a0508;border:none;
    box-shadow:0 8px 28px -8px var(--toxic-glow),inset 0 1px 0 rgba(255,255,255,.3);
    text-shadow:none;
  }
  .btn-ok:hover:not(:disabled){box-shadow:0 14px 36px -10px var(--toxic-glow),inset 0 1px 0 rgba(255,255,255,.4);filter:brightness(1.08)}

  .btn-bad{
    background:linear-gradient(135deg,var(--blood) 0%,var(--blood2) 100%);
    color:#fff;border:none;
    box-shadow:0 8px 28px -8px var(--blood-glow),inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn-bad:hover:not(:disabled){box-shadow:0 14px 36px -10px var(--blood-glow),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.1)}

  .btn-ghost{
    background:linear-gradient(135deg,var(--ghost) 0%,var(--ghost2) 100%);
    color:#fff;border:none;
    box-shadow:0 8px 28px -8px var(--ghost-glow),inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn-ghost:hover:not(:disabled){box-shadow:0 14px 36px -10px var(--ghost-glow),inset 0 1px 0 rgba(255,255,255,.3);filter:brightness(1.1)}

  .msg{
    padding:15px 20px;border-radius:15px;font-weight:600;margin-top:20px;
    display:flex;align-items:center;gap:12px;font-size:.9rem;word-break:break-word;
    animation:slideDown .4s cubic-bezier(.16,1,.3,1);border:1px solid;line-height:1.45;
    backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  }
  .msg .ico{
    font-size:1.15rem;flex-shrink:0;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;
  }
  .msg-info{background:var(--ghost-soft);color:var(--ghost);border-color:rgba(167,139,250,.3)}
  .msg-info .ico{background:var(--ghost);color:#fff}
  .msg-ok{background:var(--toxic-soft);color:var(--toxic);border-color:rgba(123,255,61,.3)}
  .msg-ok .ico{background:var(--toxic);color:#0a0508}
  .msg-bad{background:var(--blood-soft);color:var(--blood);border-color:rgba(230,51,71,.3)}
  .msg-bad .ico{background:var(--blood);color:#fff}
  .msg-warn{background:var(--candy-soft);color:var(--candy);border-color:rgba(255,179,64,.3)}
  .msg-warn .ico{background:var(--candy);color:#0a0508}

  /* ============================================================
     POPUP MODAL
  ============================================================ */
  .popup-backdrop{
    position:fixed;inset:0;z-index:200;
    background:rgba(5,2,5,.72);
    display:none;align-items:center;justify-content:center;
    padding:24px;
  }
  .popup-backdrop.show{
    display:flex;
    animation:backdropIn .35s ease both;
  }
  .popup-backdrop.closing{
    animation:backdropOut .3s ease forwards;
    pointer-events:none;
  }
  .popup{
    background:var(--surf);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--brd2);
    border-radius:28px;
    padding:36px 30px 30px;
    width:100%;max-width:360px;
    position:relative;
    overflow:hidden;
    box-shadow:0 40px 80px -20px rgba(0,0,0,.9),0 0 60px -12px var(--pumpkin-glow);
    animation:popupIn .5s cubic-bezier(.16,1,.3,1) both;
    text-align:center;
  }
  .popup.closing{animation:popupOut .3s cubic-bezier(.4,0,1,1) forwards}
  .popup::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--pumpkin),var(--toxic),transparent);
    background-size:200% 100%;animation:shimmer 2.5s linear infinite;
  }
  .popup::after{
    content:'';position:absolute;top:-80px;right:-80px;width:160px;height:160px;
    background:radial-gradient(circle,var(--pumpkin-glow) 0%,transparent 70%);
    border-radius:50%;opacity:.35;pointer-events:none;animation:orbFloat1 6s ease-in-out infinite;
  }

  .popup-emoji{
    font-size:3.4rem;line-height:1;margin-bottom:14px;
    display:inline-block;position:relative;
    animation:bounce 1.2s ease-in-out infinite;
    filter:drop-shadow(0 8px 20px var(--pumpkin-glow));
  }
  .popup-title{
    font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;
    color:var(--txt2);margin-bottom:18px;position:relative;z-index:1;
  }
  .popup-team{
    font-size:1.6rem;font-weight:900;letter-spacing:-.03em;line-height:1.2;
    margin-bottom:6px;position:relative;z-index:1;
    background:linear-gradient(120deg,var(--pumpkin) 0%,var(--blood) 60%,var(--ghost) 100%);
    background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;animation:gradientShift 4s ease infinite;
    word-break:break-word;
  }
  .popup-name{
    font-size:.92rem;color:var(--txt2);font-weight:600;margin-bottom:26px;
    position:relative;z-index:1;word-break:break-word;
  }
  .popup .btn{width:100%;margin-top:6px;min-height:56px;font-size:1rem;position:relative;z-index:1}
  .popup-close{
    position:absolute;top:14px;right:14px;z-index:5;
    width:32px;height:32px;border-radius:50%;
    background:var(--surf2);border:1px solid var(--brd);
    color:var(--txt2);cursor:pointer;font-size:.9rem;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .popup-close:hover{background:var(--blood-soft);color:var(--blood);border-color:rgba(230,51,71,.35);transform:rotate(90deg)}

  /* SUCCESS STATE — replaces popup content */
  .popup.success-state .popup-emoji{
    animation:pop .5s cubic-bezier(.16,1,.3,1) both;
  }
  .popup.success-state .popup-team{
    background:linear-gradient(120deg,var(--toxic) 0%,var(--pumpkin) 100%);
    background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }

  /* CONFETTI */
  .confetti-container{
    position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;
  }
  .confetti{
    position:absolute;width:8px;height:8px;top:50%;left:50%;
    border-radius:2px;pointer-events:none;
    animation:confettiFly 1.4s cubic-bezier(.16,1,.3,1) forwards;
  }
  .confetti:nth-child(1){background:var(--pumpkin);--tx:-120px;--ty:-140px;--rot:360deg;animation-delay:0s}
  .confetti:nth-child(2){background:var(--toxic);--tx:100px;--ty:-160px;--rot:-280deg;animation-delay:.05s}
  .confetti:nth-child(3){background:var(--ghost);--tx:-140px;--ty:-100px;--rot:200deg;animation-delay:.1s}
  .confetti:nth-child(4){background:var(--blood);--tx:130px;--ty:-120px;--rot:-360deg;animation-delay:.08s}
  .confetti:nth-child(5){background:var(--candy);--tx:-90px;--ty:-170px;--rot:300deg;animation-delay:.03s}
  .confetti:nth-child(6){background:var(--pumpkin);--tx:80px;--ty:-180px;--rot:-200deg;animation-delay:.12s}
  .confetti:nth-child(7){background:var(--toxic);--tx:-110px;--ty:-60px;--rot:240deg;animation-delay:.06s}
  .confetti:nth-child(8){background:var(--ghost);--tx:110px;--ty:-70px;--rot:-300deg;animation-delay:.1s}

  /* RING EXPAND on mark success */
  .success-ring{
    position:absolute;top:50%;left:50%;
    width:60px;height:60px;
    border:3px solid var(--toxic);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    pointer-events:none;
    z-index:1;
  }
  .popup.success-state .success-ring{
    animation:ringExpand .9s cubic-bezier(.16,1,.3,1) forwards;
  }
  .popup.success-state .success-ring:nth-child(2){
    animation-delay:.15s;
    border-color:var(--pumpkin);
  }

  /* SUCCESS CHECKMARK SVG */
  .success-check{
    width:80px;height:80px;margin:0 auto 16px;
    display:none;position:relative;z-index:1;
  }
  .popup.success-state .success-check{display:block}
  .success-check circle{
    fill:none;stroke:var(--toxic);stroke-width:3;
    stroke-dasharray:220;stroke-dashoffset:220;
    animation:checkDraw .6s cubic-bezier(.16,1,.3,1) forwards;
    filter:drop-shadow(0 0 12px var(--toxic-glow));
  }
  .success-check path{
    fill:none;stroke:var(--toxic);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:40;stroke-dashoffset:40;
    animation:checkDraw .4s cubic-bezier(.16,1,.3,1) .35s forwards;
    filter:drop-shadow(0 0 10px var(--toxic-glow));
  }

  /* FLOATING HEARTS on success */
  .heart{
    position:absolute;font-size:1.4rem;pointer-events:none;
    animation:heartFloat 1.6s ease-out forwards;opacity:0;
    z-index:2;
  }

  .sp{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}

  @media(max-width:600px){
    body{padding:16px 12px 28px}
    h1{font-size:1.4rem}
    h1 .ico{font-size:1.7rem}
    .sub{font-size:.8rem}
    .btn{padding:14px 18px;font-size:.84rem;min-height:50px}
    .icon-btn{width:40px;height:40px;font-size:1rem}
    .logout-btn{right:50px;padding:0 10px;font-size:.72rem}
    .msg{padding:13px 16px;font-size:.85rem;gap:10px}
    .login-card{padding:32px 24px 26px}
    .login-icon{width:70px;height:70px;font-size:2.1rem}
    .login-title{font-size:1.4rem}
    .popup{padding:30px 22px 24px;border-radius:24px;max-width:320px}
    .popup-emoji{font-size:2.8rem}
    .popup-team{font-size:1.35rem}
    .popup-name{font-size:.85rem;margin-bottom:22px}
    .popup .btn{min-height:52px;font-size:.92rem}
    .debug-btn{width:38px;height:38px;font-size:.9rem;bottom:12px;right:12px}
    .debug-panel{bottom:58px;right:12px;min-width:220px;padding:12px 14px}
    .success-check{width:68px;height:68px}
  }
  @media(max-width:380px){
    .btn{min-height:48px;font-size:.8rem}
    .popup-team{font-size:1.2rem}
  }
</style>
</head>

<div id="loginScreen">

<script type="module">
/* ============================================================
   THREE.JS HALLOWEEN BACKGROUND
============================================================ */
import * as THREE from 'three';

(function initThree() {
  const canvas = document.getElementById('three-bg');
  if (!canvas) return;
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let renderer, scene, camera, animId;
  let pumpkins = [], bats = [], embers = null, moon = null;
  let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

  function buildScene() {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'low-power' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0508, 0.008);
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.z = 55;

    const moonMat = new THREE.MeshBasicMaterial({ color: 0xffb340, transparent: true, opacity: 0.35 });
    moon = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 32), moonMat);
    moon.position.set(-35, 22, -60);
    scene.add(moon);
    const halo = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.12, side: THREE.BackSide }));
    halo.position.copy(moon.position);
    scene.add(halo);

    const emberCount = window.innerWidth < 700 ? 180 : 340;
    const positions = new Float32Array(emberCount * 3);
    const emberSizes = new Float32Array(emberCount);
    const emberSpeeds = new Float32Array(emberCount);
    for (let i = 0; i < emberCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 120;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 80;
      emberSizes[i] = 0.3 + Math.random() * 0.9;
      emberSpeeds[i] = 0.15 + Math.random() * 0.35;
    }
    const emberGeo = new THREE.BufferGeometry();
    emberGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    emberGeo.setAttribute('size', new THREE.BufferAttribute(emberSizes, 1));
    const spriteCanvas = document.createElement('canvas');
    spriteCanvas.width = 64; spriteCanvas.height = 64;
    const sctx = spriteCanvas.getContext('2d');
    const grad = sctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,220,140,1)');
    grad.addColorStop(0.3, 'rgba(255,140,40,0.9)');
    grad.addColorStop(0.7, 'rgba(220,60,20,0.4)');
    grad.addColorStop(1, 'rgba(220,60,20,0)');
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, 64, 64);
    const sprite = new THREE.CanvasTexture(spriteCanvas);
    const emberMat = new THREE.PointsMaterial({
      size: 1.8, map: sprite, color: 0xff7a1a, transparent: true, opacity: 0.85,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
    });
    embers = new THREE.Points(emberGeo, emberMat);
    embers.userData = { speeds: emberSpeeds };
    scene.add(embers);

    const pumpkinPositions = [
      { x: -28, y: 18, z: -25, scale: 1.2 },
      { x: 32, y: -20, z: -30, scale: 0.9 },
      { x: -38, y: -22, z: -15, scale: 0.7 },
      { x: 25, y: 25, z: -40, scale: 1.0 }
    ];
    function makePumpkin(scale) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(2, 20, 16),
        new THREE.MeshStandardMaterial({ color: 0xff7a1a, roughness: 0.7, metalness: 0.05, emissive: 0xff5500, emissiveIntensity: 0.15 })
      );
      body.scale.set(1.2, 0.85, 1.2);
      group.add(body);
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.22, 0.6, 8),
        new THREE.MeshStandardMaterial({ color: 0x2d5016, roughness: 0.9 })
      );
      stem.position.y = 1.75; stem.rotation.z = 0.15;
      group.add(stem);
      const eyeGeo = new THREE.SphereGeometry(0.28, 10, 10);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffb340 });
      const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
      eyeL.position.set(-0.55, 0.2, 1.08); eyeL.scale.set(1, 1.3, 0.6);
      group.add(eyeL);
      const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
      eyeR.position.set(0.55, 0.2, 1.08); eyeR.scale.set(1, 1.3, 0.6);
      group.add(eyeR);
      const mouth = new THREE.Mesh(
        new THREE.ConeGeometry(0.5, 0.5, 4),
        new THREE.MeshBasicMaterial({ color: 0xffb340 })
      );
      mouth.position.set(0, -0.45, 1.1); mouth.rotation.x = Math.PI; mouth.scale.set(1.2, 0.7, 0.4);
      group.add(mouth);
      const light = new THREE.PointLight(0xff7a1a, 0.8, 15);
      light.position.set(0, 0, 1);
      group.add(light);
      group.scale.setScalar(scale);
      return group;
    }
    pumpkinPositions.forEach(p => {
      const pumpkin = makePumpkin(p.scale);
      pumpkin.position.set(p.x, p.y, p.z);
      pumpkin.userData = { baseY: p.y, phase: Math.random() * Math.PI * 2, floatSpeed: 0.4 + Math.random() * 0.3 };
      pumpkin.rotation.y = Math.random() * Math.PI * 2;
      scene.add(pumpkin);
      pumpkins.push(pumpkin);
    });

    scene.add(new THREE.AmbientLight(0x401a10, 0.6));
    const keyLight = new THREE.PointLight(0xff7a1a, 1.2, 80);
    keyLight.position.set(10, 20, 20);
    scene.add(keyLight);
    const fillLight = new THREE.PointLight(0x7bff3d, 0.4, 60);
    fillLight.position.set(-25, -15, 10);
    scene.add(fillLight);

    function makeBat() {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.bezierCurveTo(0.5, 0.3, 1.2, 0.4, 1.5, 0);
      shape.bezierCurveTo(1.3, -0.2, 1.0, -0.5, 0.8, -0.3);
      shape.bezierCurveTo(0.6, -0.1, 0.3, -0.15, 0, 0);
      const mesh = new THREE.Mesh(
        new THREE.ShapeGeometry(shape),
        new THREE.MeshBasicMaterial({ color: 0x1a0a10, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
      );
      mesh.scale.setScalar(1.5);
      return mesh;
    }
    for (let i = 0; i < 5; i++) {
      const bat = makeBat();
      const angle = Math.random() * Math.PI * 2;
      const radius = 35 + Math.random() * 25;
      bat.position.set(Math.cos(angle) * radius, 15 + Math.random() * 25, -20 - Math.random() * 30);
      bat.userData = { angle, radius, speed: 0.15 + Math.random() * 0.2, phase: Math.random() * Math.PI * 2 };
      scene.add(bat);
      bats.push(bat);
    }

    window.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth - 0.5) * 2;
      targetY = (e.clientY / window.innerHeight - 0.5) * 2;
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length) {
        targetX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
      }
    }, { passive: true });
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      animId = requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const dt = 0.016;
      mouseX += (targetX - mouseX) * 0.04;
      mouseY += (targetY - mouseY) * 0.04;
      pumpkins.forEach(p => {
        p.position.y = p.userData.baseY + Math.sin(t * p.userData.floatSpeed + p.userData.phase) * 1.5;
        p.rotation.y += 0.003;
        p.rotation.z = Math.sin(t * 0.5 + p.userData.phase) * 0.05;
      });
      if (embers) {
        const pos = embers.geometry.attributes.position.array;
        const speeds = embers.userData.speeds;
        for (let i = 0; i < speeds.length; i++) {
          pos[i * 3 + 1] += speeds[i] * dt * 2;
          if (pos[i * 3 + 1] > 50) {
            pos[i * 3 + 1] = -50;
            pos[i * 3] = (Math.random() - 0.5) * 120;
            pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
          }
        }
        embers.geometry.attributes.position.needsUpdate = true;
        embers.rotation.y = t * 0.02 + mouseX * 0.05;
        embers.rotation.x = mouseY * 0.03;
      }
      bats.forEach(b => {
        b.userData.angle += b.userData.speed * dt;
        b.position.x = Math.cos(b.userData.angle) * b.userData.radius;
        b.position.z = -20 - Math.sin(b.userData.angle) * 20;
        b.rotation.y = -b.userData.angle + Math.PI / 2;
        b.scale.y = 1 + Math.sin(t * 8 + b.userData.phase) * 0.15;
      });
      if (moon) moon.material.opacity = 0.3 + Math.sin(t * 0.8) * 0.05;
      camera.position.x = mouseX * 3;
      camera.position.y = -mouseY * 3;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    if (!prefersReduced) animate(); else renderer.render(scene, camera);
  }
  try { buildScene(); } catch (e) { console.warn('Three.js background failed:', e); }
})();

/* ============================================================
   DECRYPT
============================================================ */
function xor(text, key) {
  let r = '';
  for (let i = 0; i < text.length; i++)
    r += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return r;
}
function decrypt(b64, key) {
  try { return xor(decodeURIComponent(escape(atob(b64))), key); }
  catch (e) { return null; }
}
function pickField(obj, candidates) {
  const keys = Object.keys(obj);
  for (const cand of candidates) {
    const c = cand.replace(/[\s._-]/g, '').toLowerCase();
    const found = keys.find(k => k.toLowerCase().replace(/[\s._-]/g, '') === c);
    if (found && obj[found] !== '' && obj[found] != null) return String(obj[found]).trim();
  }
  for (const cand of candidates) {
    const c = cand.replace(/[\s._-]/g, '').toLowerCase();
    const found = keys.find(k => k.toLowerCase().replace(/[\s._-]/g, '').includes(c));
    if (found && obj[found] !== '' && obj[found] != null) return String(obj[found]).trim();
  }
  return '';
}

/* ============================================================
   CAMERA
============================================================ */
async function startCamera() {
  if (isCamOn) return;
  try {
    setStatus('info', 'Awakening the eye...');
    scanCanvas = document.createElement('canvas');
    scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
    cropCanvas = document.createElement('canvas');
    cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    cam.srcObject = stream;

    await new Promise(res => {
      if (cam.readyState >= 1) return res();
      cam.onloadedmetadata = () => res();
      setTimeout(res, 3000);
    });
    try { await cam.play(); } catch (e) {}

    let waited = 0;
    while ((!cam.videoWidth || !cam.videoHeight) && waited < 3000) {
      await new Promise(r => setTimeout(r, 100));
      waited += 100;
    }
    if (!cam.videoWidth) throw new Error('Camera stream has no dimensions');

    try {
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
    } catch (e) { /* ignore */ }

    isCamOn = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    vidC.classList.add('scan');
    setStatus('info', 'The eye is open — align the sigil inside the frame');

    diag = { frames: 0, decodes: 0, fpsStart: Date.now(), fps: 0, misses: 0 };
    updateDiag();

    lastScanTs = 0;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(scanLoop);
  } catch (err) {
    console.error(err);
    setStatus('bad', 'The eye will not open: ' + (err.message || 'access denied'));
    startBtn.disabled = false;
    stopBtn.disabled = true;
    vidC.classList.remove('scan');
  }
}
function stopCamera() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  cam.srcObject = null;
  isCamOn = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  vidC.classList.remove('scan');
  setStatus('info', 'The eye sleeps.');
}
startBtn.addEventListener('click', startCamera);
stopBtn.addEventListener('click', stopCamera);

function scanLoop(ts) {
  if (!isCamOn) return;
  rafId = requestAnimationFrame(scanLoop);
  if (ts - lastScanTs < SCAN_INTERVAL_MS) return;
  lastScanTs = ts;
  if (!cam.videoWidth || cam.readyState < 2) return;

  const vw = cam.videoWidth, vh = cam.videoHeight;
  const scale = Math.min(1, MAX_SCAN_DIM / Math.max(vw, vh));
  const w1 = Math.max(1, Math.floor(vw * scale));
  const h1 = Math.max(1, Math.floor(vh * scale));

  if (scanCanvas.width !== w1 || scanCanvas.height !== h1) {
    scanCanvas.width = w1;
    scanCanvas.height = h1;
  }
  scanCtx.imageSmoothingEnabled = true;
  scanCtx.imageSmoothingQuality = 'high';
  scanCtx.drawImage(cam, 0, 0, vw, vh, 0, 0, w1, h1);

  let decoded = tryJsQR(scanCtx, w1, h1);
  diag.frames++;

  if (!decoded) {
    const cw = Math.floor(w1 * 0.6);
    const ch = Math.floor(h1 * 0.6);
    const cx = Math.floor((w1 - cw) / 2);
    const cy = Math.floor((h1 - ch) / 2);
    if (cropCanvas.width !== cw || cropCanvas.height !== ch) {
      cropCanvas.width = cw;
      cropCanvas.height = ch;
    }
    cropCtx.imageSmoothingEnabled = true;
    cropCtx.imageSmoothingQuality = 'high';
    cropCtx.drawImage(scanCanvas, cx, cy, cw, ch, 0, 0, cw, ch);
    decoded = tryJsQR(cropCtx, cw, ch);
    if (!decoded) diag.misses++;
  }

  if (diag.frames % 10 === 0) {
    diag.fps = Math.round(10000 / (Date.now() - diag.fpsStart));
    diag.fpsStart = Date.now();
    updateDiag();
  }

  if (decoded) {
    diag.decodes++;
    updateDiag();
    const now = Date.now(), txt = decoded.trim();
    if (lastText === txt && (now - lastTime) < 2000) return;
    lastText = txt; lastTime = now;
    handleQR(txt);
  }
}
function tryJsQR(ctx, w, h) {
  let img;
  try { img = ctx.getImageData(0, 0, w, h); }
  catch (e) { return null; }
  try {
    const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
    return code && code.data ? code.data.trim() : null;
  } catch (e) { return null; }
}
function updateDiag() {
  dRes.textContent = cam.videoWidth ? cam.videoWidth + '×' + cam.videoHeight : '—';
  dFps.textContent = diag.fps;
  dDec.textContent = diag.decodes;
  dMiss.textContent = diag.misses;
  dFps.classList.toggle('active', diag.fps > 0);
  dDec.classList.toggle('hit', diag.decodes > 0);
}

/* ============================================================
   QR HANDLER — opens popup instead of inline result
============================================================ */
function handleQR(text) {
  if (!text.startsWith('HACKPASS:')) {
    setStatus('bad', 'This sigil is not of our making');
    return;
  }
  const b64 = text.substring('HACKPASS:'.length);
  const decrypted = decrypt(b64, CFG.secretKey);
  if (decrypted === null) {
    setStatus('bad', 'The incantation fails — wrong key or broken sigil');
    return;
  }
  let payload;
  try { payload = JSON.parse(decrypted); }
  catch (e) {
    setStatus('bad', 'The message is unreadable');
    return;
  }

  const sNo  = pickField(payload, ['s.no','sno','s_no','S.NO','serial','id','roll','rollno','roll_no']);
  const team = pickField(payload, ['team name','Team Name','team_name','group']);
  const name = pickField(payload, ['team leader','Team Leader','name','student_name','fullname','full_name']);

  currentPayload = { sNo, team, name, raw: payload };

  if (navigator.vibrate) navigator.vibrate(80);

  setStatus('ok', 'Soul detected — confirm below');
  openPopup(name, team);
}

/* ============================================================
   MARK PRESENT — inside popup, with cute success animation
============================================================ */
popupMarkBtn.addEventListener('click', async () => {
  if (!currentPayload) return;
  const { sNo, name, team } = currentPayload;
  if (!sNo) {
    setStatus('bad', 'The sigil has no marking — cannot bind to the ledger');
    popupName.textContent = 'This QR has no S.No — cannot be sealed.';
    return;
  }
  popupMarkBtn.disabled = true;
  popupMarkBtn.innerHTML = '<span class="sp"></span> Sealing...';

  try {
    const body = { token: CFG.gsToken, sheetName: CFG.gsSheet, marks: [{ sNo, present: true }] };
    const res = await fetch(CFG.gsUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    const json = await res.json();

    if (!json.ok) {
      setStatus('bad', 'The ledger refuses: ' + (json.error || 'unknown'));
      popupMarkBtn.innerHTML = '↻ Retry';
      popupMarkBtn.disabled = false;
      return;
    }
    if (json.notFound && json.notFound.length > 0) {
      setStatus('warn', 'S.No "' + sNo + '" is not in the ledger');
      popupMarkBtn.innerHTML = '↻ Retry';
      popupMarkBtn.disabled = false;
      return;
    }

    // SUCCESS — transform popup into cute celebration
    const wasAlready = json.alreadyMarked && json.alreadyMarked.length > 0;

    popup.classList.add('success-state');
    popupEmoji.textContent = wasAlready ? '👻' : '🎉';
    popupTitle.textContent = wasAlready ? 'Already Sealed' : 'Soul Sealed';
    popupTeam.textContent = team || 'Unknown Team';
    popupName.textContent = (name || sNo) + (wasAlready ? ' was already present' : ' is now present');
    popupMarkBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> ' + (wasAlready ? 'Done' : 'Sealed!');
    popupMarkBtn.className = 'btn btn-ghost';
    popupMarkBtn.disabled = true;

    if (!wasAlready) {
      spawnConfetti();
      spawnHearts();
      if (navigator.vibrate) navigator.vibrate([40, 30, 40]);
    }

    setStatus('ok', (name || sNo) + (wasAlready ? ' was already sealed' : ' has been sealed PRESENT'));

    // Auto-close after a moment so the next scan is ready
    setTimeout(() => {
      closePopup();
      // Clear so next scan doesn't re-trigger
      if (popup.classList.contains('success-state')) {
        currentPayload = null;
      }
    }, 2400);

  } catch (err) {
    setStatus('bad', 'The connection to the ledger broke: ' + String(err));
    popupMarkBtn.innerHTML = '↻ Retry';
    popupMarkBtn.disabled = false;
  }
});

/* ============================================================
   UTILS
============================================================ */
function setStatus(type, text) {
  const icons = { ok: '✓', bad: '✕', warn: '!', info: 'i' };
  statusEl.className = 'msg msg-' + type;
  statusEl.innerHTML = '<span class="ico">' + icons[type] + '</span><span>' + escapeHtml(text) + '</span>';
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}

/* ============================================================
   BOOT
============================================================ */
window.addEventListener('beforeunload', () => {
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
});
